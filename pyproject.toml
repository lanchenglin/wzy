[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wzy-workbench"
version = "0.1.0"
description = "本地只读商品对比工作台"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "beautifulsoup4>=4.12,<5", "playwright>=1.48,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "httpx>=0.27,<1"]

[project.scripts]
wzy = "wzy.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wzy = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
